[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"

[profile.ci]
verbosity = 3
fuzz = { runs = 256 }

# Gas on Arc is USDC. Mainnet 5042, testnet 5042002.
[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
